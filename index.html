<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arepería Lerma | Sistema</title>
    <!-- Cargamos Tailwind CSS para los estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center">
    
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-center text-orange-600 mb-2">Arepería Lerma</h1>
        <p class="text-center text-gray-500 mb-6">Conectado a Google Apps Script</p>
        
        <!-- Botón que activa la petición -->
        <button id="btn-consultar" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
            Cargar menú desde Google
        </button>

        <!-- Contenedor donde aparecerán los datos de Apps Script -->
        <div id="resultado" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg hidden">
            <!-- Los datos se inyectarán aquí mediante JavaScript -->
        </div>
    </div>

    <script>
        // AQUÍ PEGARÁS LA URL QUE TE DÉ GOOGLE APPS SCRIPT MÁS ADELANTE
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqF0Akgom7HEHSVtlelk6w9FyeCPxuirHafH4dNujZruu638ud-WkwOwa8OAeVuSziKA/exec';

        const btn = document.getElementById('btn-consultar');
        const resultado = document.getElementById('resultado');

        btn.addEventListener('click', async () => {
            // Mostramos estado de carga
            resultado.classList.remove('hidden');
            resultado.innerHTML = '<p class="text-gray-500 animate-pulse text-center">Conectando con Apps Script...</p>';

            try {
                // Hacemos la petición a los servidores de Google
                const respuesta = await fetch(APPS_SCRIPT_URL);
                const datos = await respuesta.json(); 
                
                // Formateamos la respuesta en pantalla
                let html = '<ul class="space-y-2">';
                datos.menu.forEach(item => {
                    html += `<li class="flex justify-between border-b pb-2">
                                <span class="font-medium">${item.nombre}</span>
                                <span class="text-green-600 font-bold">$${item.precio}</span>
                             </li>`;
                });
                html += '</ul>';
                
                resultado.innerHTML = html;

            } catch (error) {
                resultado.innerHTML = '<p class="text-red-500 text-center">Error de conexión.</p>';
                console.error("Error:", error);
            }
        });
    </script>
</body>
</html>
